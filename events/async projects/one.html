<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async</title>
</head>

<body>
    <H1>Chai or Java</H1>
    <button id="stop">stop</button>
    <button id="start">start</button>

    <script>
        // setInterval(function(){
        //     console.log("Ankit",date.now);

        // },1000)
        // const setDate = function(){
        //     console.log("Ankit", Date.now());

        // } 
        // setInterval(setDate,1000)
        const sayDate = function (str) {
            console.log(str, Date.now());
        }

        let interValid = null

        document.querySelector('#start').addEventListener('click', function () {
            // AGR intervalid null rhe to !lgaa ke chaalu kro
            if (!interValid) {
                 interValid = setInterval(sayDate, 1000, "hii");
                console.log("started", interValid);
                
            }
            

        })

        document.querySelector('#stop').addEventListener('click', function () {
            clearInterval(interValid);
            console.log("clear",interValid);
            
        })

    </script>
</body>

</html>
<!-- | Function | Kaam |
| ----------------- | -------------------------- |
| `setInterval()` | Repeat karta rehta hai |
| `clearInterval()` | Interval ko rokta hai |
| `setTimeout()` | Sirf ek baar run karta hai |
| `clearTimeout()` | Timeout ko rokta hai | -->
