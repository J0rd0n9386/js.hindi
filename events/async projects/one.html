<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async</title>
</head>

<body>
    <H1>Chai or code</H1>
    <button id="stop">stop</button>
    <script>
        // ye bss ek baar krega after 2 sec but agr setinterval lgaa diya to ye baar baar krega
        setTimeout(function () {
            console.log("Ankit");
        }, 2000);
        const Changeme = setTimeout(changetext, 2000)

        const changetext = function () {
            document.querySelector('h1').innerHTML = "Aaryan";
            console.log('Aaryan');

        };

        const interval = setInterval(changetext, 2000);
        document.getElementById('stop').addEventListener('click', function () {
            clearInterval(interval);
        })

    </script>
</body>

</html>
